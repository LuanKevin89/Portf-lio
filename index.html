<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currículo | Luan Kevin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="cabecalho">
        <div class="container cabecalho-conteudo">

            <div class="cabecalho-texto">
                <p class="subtitulo">CURRÍCULO PROFISSIONAL</p>

                <h1 id="nome"></h1>

                <h2 id="cargo"></h2>

                <p id="objetivo"></p>

                <div class="contatos">
                    <span id="email"></span>
                    <span id="telefone"></span>
                    <span id="cidade"></span>
                </div>

                <div class="redes-sociais">
                    <a id="linkedin" target="_blank" rel="noopener noreferrer">
                        LinkedIn
                    </a>

                    <a id="github" target="_blank" rel="noopener noreferrer">
                        GitHub
                    </a>
                </div>
            </div>

            <div class="cabecalho-foto">
                <img src="perfil.jpg" alt="Foto de perfil" class="foto-perfil">
            </div>

        </div>
    </header>

    <main class="container conteudo">

        <section class="secao">
            <h2>Sobre mim</h2>
            <p id="sobre"></p>
        </section>

        <section class="secao">
            <h2>Formação acadêmica</h2>

            <h3 id="formacao"></h3>
            <p id="semestre"></p>
        </section>

        <section class="secao">
            <h2>Experiência profissional</h2>

            <div id="experiencia"></div>
        </section>

        <section class="secao">
            <h2>Conhecimentos técnicos</h2>

            <div id="conhecimentos" class="lista-conhecimentos"></div>
        </section>

        <section class="secao">
            <h2>Projetos acadêmicos</h2>

            <div id="projetos"></div>
        </section>

        <section class="secao">
            <h2>Habilidades</h2>

            <ul id="habilidades" class="lista-habilidades"></ul>
        </section>

        <section class="secao">
            <h2>Disponibilidade</h2>

            <p id="disponibilidade"></p>
        </section>

    </main>

    <footer>
        <p>© Luan Kevin - 2026 </p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
